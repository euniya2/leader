<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여백의 시간 · 멀티 모드 타이머</title>
<style>
@property --bg1{syntax:"<color>";inherits:true;initial-value:#f7f2e9}@property --bg2{syntax:"<color>";inherits:true;initial-value:#e8e7db}:root{--bg1:#f7f2e9;--bg2:#e8e7db;--accent:#8e8774;--ink:#46463f}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:linear-gradient(140deg,var(--bg1),var(--bg2));transition:--bg1 .6s ease,--bg2 .6s ease,background-color .6s ease;overflow-x:hidden}body[data-mode=focus]{--bg1:#f4f1e9;--bg2:#dce5db;--accent:#6e8b77}body[data-mode=discuss]{--bg1:#f9f1e7;--bg2:#ebdccd;--accent:#a78464}body[data-mode=rest]{--bg1:#f4f4e7;--bg2:#e5eacb;--accent:#849569}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 15%,#ffffffb8,transparent 45%),radial-gradient(circle at 90% 90%,#ffffff7a,transparent 42%);pointer-events:none}button,input{font:inherit}button{cursor:pointer}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:30px 18px 34px}.eyebrow{font-weight:800;letter-spacing:.28em;font-size:12px;color:#8e9286;text-transform:uppercase}.heading{text-align:center;margin-bottom:32px}.heading h1{margin:12px 0 8px;font-size:clamp(24px,3vw,38px);font-weight:700;letter-spacing:-.055em}.heading p{font-size:14px;color:#94968c;margin:0}.mode-switch{display:flex;gap:7px;padding:6px;border-radius:999px;background:#ffffff8c;border:1px solid #ffffffd9;box-shadow:0 8px 32px #70694d0c;margin-bottom:22px}.mode-switch button{border:0;background:transparent;color:#8c8d82;border-radius:999px;padding:13px 22px;font-size:14px;font-weight:800;transition:background .6s,color .3s,box-shadow .3s}.mode-switch button.active{background:#fffdf9;color:var(--accent);box-shadow:0 4px 18px #766e581c}.glass{width:min(1100px,96vw);min-height:385px;display:flex;justify-content:center;align-items:center;flex-direction:column;border:1px solid #fffefa;border-radius:38px;background:#ffffff80;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 20px 80px #716b4a17, inset 0 1px 2px #ffffffc4;padding:30px 14px}.mode-name{color:var(--accent);font-weight:800;letter-spacing:.2em;font-size:clamp(12px,1.4vw,17px);transition:color .6s}.time{font-variant-numeric:tabular-nums;letter-spacing:-.075em;font-weight:300;font-size:clamp(90px,27vh,280px);line-height:1.28;white-space:nowrap;text-align:center;width:100%;border:0;background:none;outline:none;color:var(--ink);cursor:text;min-width:0;padding:0}.time:focus{color:#6f806c}.edit-tip{font-size:13px;color:#96998e;letter-spacing:.02em;text-align:center}.buttons{display:flex;align-items:center;gap:12px;margin-top:30px}.main-btn,.secondary-btn{height:56px;border-radius:100px;padding:0 35px;font-weight:800;font-size:15px;transition:transform .2s,box-shadow .2s}.main-btn{border:0;background:var(--accent);color:white;min-width:176px;box-shadow:0 12px 25px #72785d2d}.secondary-btn{border:1px solid #dddccf;background:#ffffff9c;color:#777a6e}.main-btn:hover,.secondary-btn:hover{transform:translateY(-2px)}.footer{color:#9da092;text-align:center;font-size:12px;margin-top:32px;letter-spacing:.03em}.flash{position:fixed;inset:0;background:#fffdf7;pointer-events:none;opacity:0;z-index:10}.flash.play{animation:flash3 1.8s ease-in-out forwards}@keyframes flash3{0%,16%,33%,50%,66%,83%,100%{opacity:0}8%,25%,41%,58%,75%,91%{opacity:.88}}@media(max-width:650px){.heading{margin-bottom:24px}.mode-switch{width:100%;max-width:440px;justify-content:center}.mode-switch button{padding:12px 10px;flex:1;font-size:12px}.glass{min-height:285px;border-radius:25px}.time{font-size:clamp(75px,19vw,160px)}.buttons{margin-top:23px}.main-btn,.secondary-btn{padding:0 22px;height:52px}}
/* 전체화면에서는 타이머 이외의 메뉴, 버튼, 설명을 감춥니다. */
.utility-controls{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:17px;color:#777a6e;font-size:14px;font-weight:650}
.mute-control{display:inline-flex;align-items:center;gap:9px;cursor:pointer}.mute-control input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}.utility-controls .secondary-btn{height:42px;padding:0 22px;font-size:13px}
body.is-fullscreen{overflow:hidden}body.is-fullscreen .page{height:100vh;height:100dvh;min-height:0;padding:0}body.is-fullscreen .heading,body.is-fullscreen .mode-switch,body.is-fullscreen .buttons,body.is-fullscreen .footer,body.is-fullscreen .utility-controls,body.is-fullscreen .mode-name,body.is-fullscreen .edit-tip{display:none!important}
body.is-fullscreen .glass{width:100vw;height:100vh;height:100dvh;min-height:0;border:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none;padding:0;overflow:hidden}
body.is-fullscreen .time{font-size:min(38vh,21vw);font-size:min(38dvh,21vw);font-weight:350;line-height:1.1;cursor:default;pointer-events:none}
@media(prefers-reduced-motion:reduce){.flash.play{animation-duration:1.8s}}
</style></head><body data-mode="focus"><div class="page"><header class="heading"><div class="eyebrow">A MOMENT TO FOCUS</div><h1>여백의 시간</h1><p>지금 필요한 리듬으로 시간을 채워보세요.</p></header><nav class="mode-switch" aria-label="타이머 모드"><button data-preset="focus" class="active" aria-pressed="true">집중 25분</button><button data-preset="discuss" aria-pressed="false">토론 10분</button><button data-preset="rest" aria-pressed="false">휴식 5분</button></nav><main class="glass"><div id="modeName" class="mode-name">FOCUS TIME</div><input class="time" id="clock" type="text" value="25:00" aria-label="남은 시간, 분 콜론 초 형식으로 수정 가능" spellcheck="false" inputmode="numeric" maxlength="6"><div class="edit-tip" id="tip">숫자를 클릭하면 시간을 직접 수정할 수 있어요</div></main><div class="buttons"><button class="main-btn" id="start">▶ 시작</button><button class="secondary-btn" id="reset">↺ 처음으로</button></div><div class="utility-controls"><label class="mute-control"><input id="mute" type="checkbox"> 소리 끄기</label><button class="secondary-btn" id="fullscreen" type="button">⛶ 전체화면</button></div><div class="footer" id="footer">좋은 집중은 작은 여백에서 시작됩니다.</div></div><div class="flash" id="flash" aria-hidden="true"></div>
<script>
// 모드별 초기 시간(초), 화면에 표시할 제목, 하단 문구를 정의합니다.
const modes={focus:{seconds:25*60,title:'FOCUS TIME',footer:'좋은 집중은 작은 여백에서 시작됩니다.'},discuss:{seconds:10*60,title:'DISCUSSION TIME',footer:'서로의 생각에 귀 기울이는 시간입니다.'},rest:{seconds:5*60,title:'REST TIME',footer:'잠깐의 쉼이 다음 순간을 밝힙니다.'}};
const $=id=>document.getElementById(id);const clock=$('clock'),startBtn=$('start');let mode='focus',remaining=modes.focus.seconds,resetTo=remaining,deadline=0,timer=null,running=false;let audioContext=null,fullScreenFallback=false;
const format=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function show(){if(document.activeElement!==clock)clock.value=format(remaining);document.title=`${format(remaining)} · 여백의 시간`}
function stop(){if(timer!==null)clearInterval(timer);timer=null;running=false;startBtn.textContent='▶ 시작'}
// Web Audio API로 짧고 부드러운 3음 알림을 합성합니다. 외부 음원은 사용하지 않습니다.
function prepareAudio(){if($('mute').checked)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioContext)audioContext=new AC();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});}catch(e){console.warn('오디오를 사용할 수 없습니다.',e)}}
function playAlarm(){if($('mute').checked)return;prepareAudio();if(!audioContext||audioContext.state!=='running')return;
 const now=audioContext.currentTime;[660,880,660].forEach((frequency,i)=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),start=now+i*.32;oscillator.type='sine';oscillator.frequency.setValueAtTime(frequency,start);gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.15,start+.025);gain.gain.exponentialRampToValueAtTime(.001,start+.26);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(start);oscillator.stop(start+.28)})}
function flash(){const el=$('flash');el.classList.remove('play');void el.offsetWidth;el.classList.add('play')}
// 실제 종료 예정 시각을 기준으로 시간을 계산해 브라우저 탭 비활성 상태에서도 오차를 줄입니다.
function tick(){remaining=Math.max(0,Math.ceil((deadline-performance.now())/1000));show();if(remaining===0){stop();flash();playAlarm();$('tip').textContent='시간이 종료되었습니다. 수고하셨어요!'}}
function begin(){if(running)return;prepareAudio();if(document.activeElement===clock)clock.blur();if(remaining<=0)remaining=resetTo;deadline=performance.now()+remaining*1000;running=true;startBtn.textContent='Ⅱ 일시정지';$('tip').textContent='온전히 지금 이 순간에 집중하세요';timer=setInterval(tick,100);show()}
startBtn.onclick=()=>{if(running){tick();stop();$('tip').textContent='잠시 멈춘 상태입니다';show()}else begin()};
$('reset').onclick=()=>{stop();remaining=resetTo;$('tip').textContent='숫자를 클릭하면 시간을 직접 수정할 수 있어요';show()};
// 모드 변경은 진행 중인 타이머를 중지하고 새 기본 시간을 적용합니다.
document.querySelectorAll('[data-preset]').forEach(btn=>btn.onclick=()=>{stop();mode=btn.dataset.preset;document.body.dataset.mode=mode;remaining=resetTo=modes[mode].seconds;$('modeName').textContent=modes[mode].title;$('footer').textContent=modes[mode].footer;$('tip').textContent='숫자를 클릭하면 시간을 직접 수정할 수 있어요';document.querySelectorAll('[data-preset]').forEach(b=>{const active=b===btn;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});show()});
// MM:SS 또는 숫자(분 단위)를 허용합니다. 최대 999분 59초까지 입력 가능합니다.
function parseTime(raw){raw=raw.trim();let m,s;if(/^\d{1,3}:\d{1,2}$/.test(raw)){[m,s]=raw.split(':').map(Number)}else if(/^\d{1,3}$/.test(raw)){m=Number(raw);s=0}else return null;if(m>999||s>59)return null;return m*60+s}
clock.addEventListener('focus',()=>{if(running){tick();stop()}clock.select();$('tip').textContent='예: 12:30 또는 12 (12분)'});
clock.addEventListener('keydown',e=>{if(e.key==='Enter')clock.blur();if(e.key==='Escape'){clock.value=format(remaining);clock.blur()}});
clock.addEventListener('blur',()=>{const secs=parseTime(clock.value);if(secs!==null){remaining=resetTo=secs;$('tip').textContent='설정한 시간으로 시작할 수 있어요'}else{$('tip').textContent='시간은 12:30 형태로 입력해 주세요'}show()});
// 전체화면 API를 사용하고, 지원되지 않는 환경에서는 화면 채우기 모드로 전환합니다.
const fullBtn=$('fullscreen');
function reflectFullscreen(){const isFull=Boolean(document.fullscreenElement)||fullScreenFallback;document.body.classList.toggle('is-fullscreen',isFull);clock.readOnly=isFull;if(isFull&&document.activeElement===clock)clock.blur();fullBtn.textContent=isFull?'전체화면 종료':'⛶ 전체화면'}
fullBtn.addEventListener('click',async()=>{if(document.fullscreenElement||fullScreenFallback){if(document.fullscreenElement)await document.exitFullscreen().catch(()=>{});fullScreenFallback=false;reflectFullscreen();return}try{if(!document.documentElement.requestFullscreen)throw Error('unsupported');await document.documentElement.requestFullscreen()}catch(e){fullScreenFallback=true}reflectFullscreen()});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)fullScreenFallback=false;reflectFullscreen()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&fullScreenFallback){fullScreenFallback=false;reflectFullscreen()}});
// 키보드만으로도 타이머를 조작할 수 있도록 기본 버튼을 사용합니다.
show();
</script></body></html>
