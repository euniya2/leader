<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 관리 투두리스트</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for clean icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-list-check text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">오늘의 업무 관리</h1>
                    <p class="text-xs text-slate-500" id="current-date"></p>
                </div>
            </div>
            <div class="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-full text-xs font-medium text-slate-600">
                <i class="fa-regular fa-clock"></i>
                <span id="live-time"></span>
            </div>
        </div>
    </header>

    <main class="max-w-3xl w-full mx-auto px-4 py-8 flex-grow space-y-6">

        <!-- Progress Bar Card -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-semibold text-slate-700">오늘의 업무 달성률</span>
                <span id="progress-text" class="text-sm font-bold text-blue-600">0%</span>
            </div>
            <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-blue-600 h-full transition-all duration-500 rounded-full" style="width: 0%"></div>
            </div>
            <div class="flex justify-between items-center mt-3 text-xs text-slate-400">
                <span id="task-count-summary">전체 0개 중 0개 완료</span>
                <span id="motivational-text">오늘 하루도 파이팅하세요! ✨</span>
            </div>
        </div>

        <!-- Task Input Form -->
        <form id="task-form" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
            <div class="relative w-full">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-solid fa-plus"></i>
                </span>
                <input type="text" id="task-input" placeholder="새로운 업무를 입력하세요 (예: 주간 회의 자료 작성)..." 
                    class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 mb-1">카테고리</label>
                    <select id="task-category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="업무">💼 업무</option>
                        <option value="개인">👤 개인</option>
                        <option value="쇼핑">🛍️ 쇼핑</option>
                        <option value="약속">🤝 약속</option>
                        <option value="기타">📌 기타</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 mb-1">마감일</label>
                    <input type="date" id="task-duedate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 mb-1">중요도</label>
                    <div class="flex gap-2">
                        <select id="task-priority" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="normal">보통</option>
                            <option value="high">🔴 긴급/중요</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="flex justify-end pt-1">
                <button type="submit" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-xl text-sm transition-all shadow-sm hover:shadow active:scale-95 flex items-center justify-center">
                    추가하기
                </button>
            </div>
        </form>

        <!-- Filter Tabs -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-slate-200 pb-3">
            <div class="flex flex-wrap items-center gap-1 bg-slate-200/60 p-1 rounded-xl w-full sm:w-auto" id="filter-tabs">
                <button type="button" data-filter="all" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-blue-600 shadow-sm transition-all flex-grow sm:flex-grow-0">전체</button>
                <button type="button" data-filter="active" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition-all flex-grow sm:flex-grow-0">미완료</button>
                <button type="button" data-filter="completed" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition-all flex-grow sm:flex-grow-0">완료됨</button>
            </div>
            <!-- Category Filter Dropdown -->
            <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                <select id="category-filter" class="bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                    <option value="all">모든 카테고리</option>
                    <option value="업무">💼 업무</option>
                    <option value="개인">👤 개인</option>
                    <option value="쇼핑">🛍️ 쇼핑</option>
                    <option value="약속">🤝 약속</option>
                    <option value="기타">📌 기타</option>
                </select>
                <button type="button" id="clear-completed" class="text-xs text-slate-400 hover:text-red-500 transition-colors font-medium whitespace-nowrap">
                    완료 삭제
                </button>
            </div>
        </div>

        <!-- Task List Container -->
        <div class="space-y-3" id="task-list">
            <!-- Dynamic Tasks will be injected here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center">
            <div class="w-16 h-16 bg-slate-100 text-slate-300 rounded-full flex items-center justify-center text-2xl mb-3">
                <i class="fa-regular fa-clipboard"></i>
            </div>
            <p class="text-sm font-medium text-slate-600">등록된 업무가 없습니다.</p>
            <p class="text-xs text-slate-400 mt-1">오늘 처리할 업무를 위 입력창에 추가해보세요.</p>
        </div>

    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        <p>&copy; Office Task Manager. 직장인을 위한 스마트한 하루 업무 관리.</p>
    </footer>

    <!-- Custom Notification Box (Instead of alert) -->
    <div id="notification-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl border border-slate-100 transform scale-95 transition-transform duration-300" id="notification-content">
            <div class="text-center">
                <div id="notification-icon" class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-3 text-lg">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h3 id="notification-title" class="text-base font-bold text-slate-800 mb-1">알림</h3>
                <p id="notification-message" class="text-xs text-slate-500 mb-5 leading-relaxed">메시지 내용</p>
                <button type="button" id="notification-close-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl text-sm transition-all shadow-sm">
                    확인
                </button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskCategory = document.getElementById('task-category');
        const taskDuedate = document.getElementById('task-duedate');
        const taskPriority = document.getElementById('task-priority');
        const taskListContainer = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const taskCountSummary = document.getElementById('task-count-summary');
        const motivationalText = document.getElementById('motivational-text');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const categoryFilter = document.getElementById('category-filter');
        const clearCompletedBtn = document.getElementById('clear-completed');
        
        // Modal elements
        const notificationModal = document.getElementById('notification-modal');
        const notificationContent = document.getElementById('notification-content');
        const notificationCloseBtn = document.getElementById('notification-close-btn');
        const notificationTitle = document.getElementById('notification-title');
        const notificationMessage = document.getElementById('notification-message');
        const notificationIcon = document.getElementById('notification-icon');

        // State variables
        let tasks = JSON.parse(localStorage.getItem('office_tasks')) || [
            { id: 1, text: '오전 팀 주간 회의 참석 및 안건 공유', completed: true, priority: 'high', category: '업무', duedate: new Date().toISOString().split('T')[0] },
            { id: 2, text: '3분기 프로젝트 기획서 초안 작성', completed: false, priority: 'high', category: '업무', duedate: new Date().toISOString().split('T')[0] },
            { id: 3, text: '부모님 생신 선물 주문하기', completed: false, priority: 'normal', category: '쇼핑', duedate: '' }
        ];
        let currentFilter = 'all';
        let currentCategoryFilter = 'all';

        // Set default due date to today
        taskDuedate.value = new Date().toISOString().split('T')[0];

        // Custom Notification Function (replaces alert)
        function showNotification(title, message, type = 'warning') {
            notificationTitle.textContent = title;
            notificationMessage.textContent = message;
            
            if (type === 'success') {
                notificationIcon.className = 'w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 text-lg';
                notificationIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else {
                notificationIcon.className = 'w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-3 text-lg';
                notificationIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }

            notificationModal.classList.remove('hidden');
            setTimeout(() => {
                notificationModal.classList.remove('opacity-0');
                notificationContent.classList.remove('scale-95');
                notificationContent.classList.add('scale-100');
            }, 10);
        }

        function hideNotification() {
            notificationModal.classList.add('opacity-0');
            notificationContent.classList.remove('scale-100');
            notificationContent.classList.add('scale-95');
            setTimeout(() => {
                notificationModal.classList.add('hidden');
            }, 300);
        }

        notificationCloseBtn.addEventListener('click', hideNotification);
        notificationModal.addEventListener('click', (e) => {
            if (e.target === notificationModal) hideNotification();
        });

        // Date and Time updater
        function updateDateTime() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('ko-KR', options);
            document.getElementById('live-time').textContent = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Save to localStorage
        function saveTasks() {
            localStorage.setItem('office_tasks', JSON.stringify(tasks));
        }

        // Render Tasks and Metrics
        function renderTasks() {
            taskListContainer.innerHTML = '';

            // Filter tasks based on status tab and category
            const filteredTasks = tasks.filter(task => {
                const matchesStatus = 
                    currentFilter === 'active' ? !task.completed :
                    currentFilter === 'completed' ? task.completed : true;

                const matchesCategory = 
                    currentCategoryFilter === 'all' ? true : task.category === currentCategoryFilter;

                return matchesStatus && matchesCategory;
            });

            // Toggle empty state
            if (filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.remove('flex');
                emptyState.classList.add('hidden');
            }

            // Render each task item
            filteredTasks.forEach(task => {
                const card = document.createElement('div');
                card.className = `group bg-white rounded-2xl p-4 shadow-sm border transition-all flex items-center justify-between gap-3 ${
                    task.completed ? 'border-slate-200 bg-slate-50/50 opacity-75' : 'border-slate-200 hover:border-blue-300 hover:shadow'
                }`;

                const leftSection = document.createElement('div');
                leftSection.className = 'flex items-center space-x-3.5 flex-grow min-w-0';

                // Checkbox button
                const checkbox = document.createElement('button');
                checkbox.type = 'button';
                checkbox.className = `w-6 h-6 rounded-lg flex items-center justify-center border transition-all flex-shrink-0 ${
                    task.completed 
                        ? 'bg-blue-600 border-blue-600 text-white' 
                        : 'border-slate-300 bg-white hover:border-blue-500'
                }`;
                checkbox.innerHTML = task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : '';
                checkbox.addEventListener('click', () => toggleTask(task.id));

                // Task Text and details
                const textContainer = document.createElement('div');
                textContainer.className = 'flex flex-col min-w-0 flex-grow gap-1';

                const topRow = document.createElement('div');
                topRow.className = 'flex items-center gap-2 flex-wrap';

                const titleSpan = document.createElement('span');
                titleSpan.className = `text-sm font-medium transition-all ${
                    task.completed ? 'line-through text-slate-400' : 'text-slate-800'
                }`;
                titleSpan.textContent = task.text;
                topRow.appendChild(titleSpan);

                // Priority Badge if high
                if (task.priority === 'high') {
                    const badge = document.createElement('span');
                    badge.className = 'inline-flex items-center gap-1 text-[10px] font-semibold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-md';
                    badge.innerHTML = '<i class="fa-solid fa-circle text-[6px]"></i> 긴급';
                    topRow.appendChild(badge);
                }

                textContainer.appendChild(topRow);

                // Meta Info (Category & Due Date)
                const metaRow = document.createElement('div');
                metaRow.className = 'flex items-center gap-3 text-xs text-slate-400';

                // Category badge
                if (task.category) {
                    const catSpan = document.createElement('span');
                    catSpan.className = 'px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md font-medium text-[11px]';
                    catSpan.textContent = task.category;
                    metaRow.appendChild(catSpan);
                }

                // Due Date
                if (task.duedate) {
                    const dateSpan = document.createElement('span');
                    dateSpan.className = 'flex items-center gap-1';
                    const todayStr = new Date().toISOString().split('T')[0];
                    const isOverdue = !task.completed && task.duedate < todayStr;
                    
                    if (isOverdue) {
                        dateSpan.className = 'flex items-center gap-1 text-rose-500 font-medium';
                        dateSpan.innerHTML = `<i class="fa-regular fa-calendar-days"></i> 마감일: ${task.duedate} (초과)`;
                    } else {
                        dateSpan.innerHTML = `<i class="fa-regular fa-calendar-days"></i> 마감: ${task.duedate}`;
                    }
                    metaRow.appendChild(dateSpan);
                }

                textContainer.appendChild(metaRow);

                leftSection.appendChild(checkbox);
                leftSection.appendChild(textContainer);

                // Delete Button
                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'w-8 h-8 rounded-xl text-slate-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition-all opacity-0 group-hover:opacity-100 flex-shrink-0';
                deleteBtn.innerHTML = '<i class="fa-solid fa-trash-can text-xs"></i>';
                deleteBtn.addEventListener('click', () => deleteTask(task.id));

                card.appendChild(leftSection);
                card.appendChild(deleteBtn);

                taskListContainer.appendChild(card);
            });

            updateProgress();
        }

        // Update progress bar and counters
        function updateProgress() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
            taskCountSummary.textContent = `전체 ${total}개 중 ${completed}개 완료`;

            if (total > 0 && percent === 100) {
                motivationalText.textContent = '오늘의 모든 업무를 완료했습니다! 🏆';
                motivationalText.className = 'text-xs font-semibold text-emerald-600';
            } else if (percent >= 50) {
                motivationalText.textContent = '절반 이상 달성했어요, 조금만 더 힘내세요! 💪';
                motivationalText.className = 'text-xs font-medium text-blue-600';
            } else {
                motivationalText.textContent = '오늘 하루도 파이팅하세요! ✨';
                motivationalText.className = 'text-xs text-slate-400';
            }
        }

        // Add task handler
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            const category = taskCategory.value;
            const duedate = taskDuedate.value;
            const priority = taskPriority.value;

            if (!text) {
                showNotification('입력 오류', '업무 내용을 입력해주세요.', 'warning');
                return;
            }

            const newTask = {
                id: Date.now(),
                text: text,
                completed: false,
                priority: priority,
                category: category,
                duedate: duedate
            };

            tasks.unshift(newTask);
            taskInput.value = '';
            taskPriority.value = 'normal';
            taskCategory.value = '업무';
            taskDuedate.value = new Date().toISOString().split('T')[0];
            
            saveTasks();
            renderTasks();
        });

        // Toggle task completion
        function toggleTask(id) {
            tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
            saveTasks();
            renderTasks();
        }

        // Delete single task
        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            renderTasks();
        }

        // Filter tabs click handler
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => {
                    b.className = 'filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition-all flex-grow sm:flex-grow-0';
                });
                e.target.className = 'filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-blue-600 shadow-sm transition-all flex-grow sm:flex-grow-0';
                currentFilter = e.target.getAttribute('data-filter');
                renderTasks();
            });
        });

        // Category filter change handler
        categoryFilter.addEventListener('change', (e) => {
            currentCategoryFilter = e.target.value;
            renderTasks();
        });

        // Clear all completed tasks
        clearCompletedBtn.addEventListener('click', () => {
            const completedCount = tasks.filter(t => t.completed).length;
            if (completedCount === 0) {
                showNotification('안내', '삭제할 완료된 업무가 없습니다.', 'warning');
                return;
            }
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
            renderTasks();
        });

        // Initial render
        renderTasks();
    </script>
</body>
</html>
