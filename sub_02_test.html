<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f4ff">
  <title>나의 일하는 방식 | 8문항 진단</title>
  <style>
    :root { color-scheme: light; --ink:#31314a; --sub:#74748b; --purple:#7d6ac4; --line:#e7e1f2; --paper:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:28px 16px; font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 10% 15%,#ffe8ed,transparent 40%),radial-gradient(circle at 95% 85%,#dff3f1,transparent 43%),#f8f5ff; }
    .shell { width:100%; max-width:480px; }
    .brand { text-align:center; font-size:13px; font-weight:800; color:#8571bd; letter-spacing:.1em; margin:0 0 16px; }
    .card { overflow:hidden; position:relative; background:rgba(255,255,255,.94); border:1px solid rgba(255,255,255,.9); box-shadow:0 18px 65px rgba(94,75,140,.12); border-radius:30px; min-height:570px; padding:30px 26px; }
    .screen { width:100%; }
    .screen.enter { animation:enter .3s ease both; }
    .screen.exit { animation:exit .3s ease both; pointer-events:none; }
    @keyframes enter { from { opacity:0; transform:translateX(32px); } to { opacity:1; transform:translateX(0); } }
    @keyframes exit { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(-32px); } }
    @media (prefers-reduced-motion:reduce) { .screen.enter,.screen.exit { animation:none; } }
    .tag { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:8px 13px; background:#f1ebff; color:#7562b4; font-weight:800; font-size:12px; }
    h1 { font-size:34px; line-height:1.3; letter-spacing:-.05em; margin:22px 0 14px; word-break:keep-all; }
    p { color:var(--sub); line-height:1.75; word-break:keep-all; }
    .hero { text-align:center; padding:18px 0 0; }
    .hero-icon,.result-icon { display:grid; place-items:center; width:108px; height:108px; margin:0 auto 8px; border-radius:32px; background:linear-gradient(135deg,#e6ddff,#ffe8ef); font-size:54px; transform:rotate(-4deg); }
    .hero h1 { margin-top:24px; }
    .hero p { font-size:15px; margin-bottom:37px; }
    .button { border:0; border-radius:18px; cursor:pointer; width:100%; min-height:58px; background:#8470d0; color:white; font-size:17px; font-weight:800; font-family:inherit; box-shadow:0 9px 22px rgba(117,92,196,.19); transition:transform .15s,filter .15s; }
    .button:hover { filter:brightness(1.05); } .button:active { transform:scale(.98); } .button:focus-visible,.choice:focus-visible { outline:3px solid #b9a5f8; outline-offset:3px; }
    .tiny { font-size:12px; color:#a09db0; text-align:center; margin-top:17px; }
    .question-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:15px; color:#8c80ad; font-weight:800; font-size:14px; }
    .progress { height:9px; border-radius:99px; background:#f1eefa; overflow:hidden; }
    .progress > div { width:0; height:100%; background:linear-gradient(90deg,#afa0eb,#85c9c3); border-radius:99px; transition:width .3s ease; }
    .question-no { margin:34px 0 8px; font-weight:800; font-size:14px; color:#9a85d7; }
    h2 { margin:0; font-size:clamp(22px,5.6vw,27px); line-height:1.48; letter-spacing:-.04em; min-height:112px; word-break:keep-all; }
    .choice-list { display:grid; gap:14px; margin-top:26px; }
    .choice { text-align:left; width:100%; min-height:96px; padding:20px 20px; border-radius:19px; border:2px solid #efeaf7; background:#fcfaff; color:#3e3c53; font-size:17px; line-height:1.5; font-weight:650; cursor:pointer; font-family:inherit; transition:background .15s,border-color .15s,transform .15s; display:flex; align-items:center; gap:14px; word-break:keep-all; }
    .choice:nth-child(2) { background:#f7fcfb; border-color:#e6f2ee; }
    .choice:hover { border-color:#a596df; } .choice:active { transform:scale(.99); }
    .choice.selected { background:#eee8ff; border-color:#9986dc; }
    .choice-letter { flex:0 0 32px; width:32px; height:32px; display:grid; place-items:center; border-radius:10px; background:white; font-weight:900; color:#8e79cb; }
    .result { text-align:center; } .result-icon { margin-top:18px; }
    .eyebrow { color:#8f7ac9; font-weight:800; font-size:14px; margin:20px 0 0; }
    .result h1 { font-size:30px; margin:8px 0 11px; }
    .result .summary { margin:0 0 20px; font-size:16px; }
    .result-details { display:grid; grid-template-columns:1fr 1fr; gap:11px; margin:22px 0 21px; text-align:left; }
    .match { padding:16px 13px; background:#f1fbf6; border-radius:17px; } .match.bad { background:#fff3f4; }
    .match strong { display:block; color:#537f70; font-size:13px; margin-bottom:9px; } .match.bad strong { color:#b47783; }
    .match span { font-size:16px; font-weight:800; word-break:keep-all; }
    .note { font-size:13px; line-height:1.65; margin:12px 0 20px; }
    /* 결과 유형마다 화면 전체의 배경, 카드, 강조색을 바꾸는 테마입니다. */
    body { transition:background .35s ease, color .35s ease; }
    body[data-result] { background:radial-gradient(circle at 12% 14%,var(--glow-one),transparent 48%),radial-gradient(circle at 90% 85%,var(--glow-two),transparent 50%),var(--page-tone); }
    body[data-result] .card { background:var(--card-tone); border-color:var(--card-edge); box-shadow:0 20px 65px var(--shadow-tone); transition:background .35s ease,border-color .35s ease; }
    body[data-result] .brand,body[data-result] .eyebrow { color:var(--accent); }
    body[data-result] .tag { color:var(--accent); background:var(--tag-tone); }
    body[data-result] .result-icon { background:linear-gradient(135deg,var(--icon-one),var(--icon-two)); box-shadow:0 12px 30px var(--shadow-tone); }
    body[data-result] .result h1 { color:var(--accent); }
    body[data-result] .result .summary { color:var(--ink); }
    body[data-result] .match { background:var(--match-tone); }
    body[data-result] .match strong { color:var(--accent); }
    body[data-result] .match.bad { background:var(--contrast-tone); }
    body[data-result] .match.bad strong { color:var(--contrast-ink); }
    body[data-result] .button { background:var(--accent); box-shadow:0 9px 22px var(--shadow-tone); }
    body[data-result] .footer { color:var(--accent); }
    /* 🌙 라벤더 / ⚡ 코랄 / 🧭 민트 / ☀️ 살구빛 옐로 */
    body[data-result="focus"] { --page-tone:#f2efff; --glow-one:#dad4ff; --glow-two:#e6dfff; --card-tone:#fdfcff; --card-edge:#ece6ff; --accent:#7160b9; --tag-tone:#eae4ff; --icon-one:#d7ccff; --icon-two:#eee7ff; --match-tone:#ede8ff; --contrast-tone:#fff0f0; --contrast-ink:#b17282; --shadow-tone:rgba(103,82,165,.17); }
    body[data-result="action"] { --page-tone:#fff2ed; --glow-one:#ffd5c4; --glow-two:#ffe2cf; --card-tone:#fffcfa; --card-edge:#ffe4d9; --accent:#c45f50; --tag-tone:#ffe4da; --icon-one:#ffc4ad; --icon-two:#ffdfc2; --match-tone:#ffe9db; --contrast-tone:#f1ebff; --contrast-ink:#7866b2; --shadow-tone:rgba(193,98,74,.15); }
    body[data-result="plan"] { --page-tone:#eaf9f5; --glow-one:#c7eee4; --glow-two:#ddf8e9; --card-tone:#fbfffd; --card-edge:#d9f1e8; --accent:#287f70; --tag-tone:#d9f4e9; --icon-one:#bce9de; --icon-two:#d7f6e8; --match-tone:#dff4ed; --contrast-tone:#fff0e9; --contrast-ink:#b67658; --shadow-tone:rgba(48,131,110,.15); }
    body[data-result="people"] { --page-tone:#fff9e9; --glow-one:#ffebac; --glow-two:#ffdccb; --card-tone:#fffefa; --card-edge:#fff0cb; --accent:#a66a24; --tag-tone:#fff0c6; --icon-one:#ffe6a1; --icon-two:#ffd9bb; --match-tone:#fff1cf; --contrast-tone:#e8f3ff; --contrast-ink:#547eaa; --shadow-tone:rgba(175,121,47,.15); }
    .footer { color:#aca2bf; text-align:center; font-size:12px; margin:16px 0 0; }
    @media(max-width:360px) { .card { padding:25px 19px; min-height:560px; } .choice { padding:15px 14px; } h1 { font-size:30px; } }
  </style>
</head>
<body>
  <main class="shell">
    <p class="brand">✦ LITTLE WORK LAB ✦</p>
    <section class="card" aria-live="polite" aria-atomic="true" id="app"></section>
    <p class="footer">정답은 없어요. 지금의 나와 가까운 답을 골라주세요 ♡</p>
  </main>
  <script>
    'use strict';
    // 네 가지 유형: 질문의 선택지가 해당 유형에 1점을 부여합니다.
    const types = {
      focus: { name:'새벽형 몰입가', emoji:'🌙', description:'조용한 집중 속에서 깊이 있는 결과를 만드는 사람', good:'햇살형 연결가', bad:'번개형 추진가' },
      action: { name:'번개형 추진가', emoji:'⚡', description:'완벽한 계획보다 빠른 실행으로 길을 여는 사람', good:'나침반형 설계가', bad:'새벽형 몰입가' },
      plan: { name:'나침반형 설계가', emoji:'🧭', description:'큰 그림과 촘촘한 순서로 팀에 안정감을 주는 사람', good:'번개형 추진가', bad:'햇살형 연결가' },
      people: { name:'햇살형 연결가', emoji:'☀️', description:'대화와 협력으로 사람들의 가능성을 이끌어내는 사람', good:'새벽형 몰입가', bad:'나침반형 설계가' }
    };
    // 질문 8개. 각 선택지의 score 키에 해당하는 유형 점수를 더합니다.
    const questions = [
      { q:'새 프로젝트를 시작할 때 나는?', a:[['혼자 자료를 깊이 읽으며 감을 잡는다','focus'],['일단 작은 결과물부터 만들어 본다','action']] },
      { q:'갑자기 일이 많아지면 나는?', a:[['할 일을 정리하고 우선순위를 세운다','plan'],['주변과 이야기하며 역할을 나눈다','people']] },
      { q:'가장 신나는 순간은?', a:[['방해 없이 한 가지에 푹 빠질 때','focus'],['아이디어가 실제로 움직이기 시작할 때','action']] },
      { q:'회의를 할 때 더 중요한 건?', a:[['목표와 다음 단계를 명확히 정하는 것','plan'],['모두가 편하게 의견을 내는 분위기','people']] },
      { q:'예상치 못한 문제가 생기면?', a:[['원인을 충분히 파고들어 해결한다','focus'],['가능한 해결책을 바로 시도한다','action']] },
      { q:'함께 일할 때 내가 자주 맡는 역할은?', a:[['일정과 흐름을 차분히 관리한다','plan'],['의견을 이어주고 서로를 북돋는다','people']] },
      { q:'일을 잘했다고 느끼는 기준은?', a:[['완성도가 높고 깊이가 있을 때','focus'],['실질적인 진전과 성과가 보일 때','action']] },
      { q:'이상적인 팀의 모습은?', a:[['방향과 기준이 분명한 팀','plan'],['신뢰와 소통이 자연스러운 팀','people']] }
    ];

    const app = document.getElementById('app');
    let index = -1; // -1: 시작 화면, 0~7: 질문, 8: 결과 화면
    let scores = { focus:0, action:0, plan:0, people:0 };
    let busy = false;

    // 화면을 0.3초 동안 옆으로 밀어 전환합니다.
    function show(html) {
      const previous = app.querySelector('.screen');
      if (!previous) { app.innerHTML = `<div class="screen enter">${html}</div>`; return; }
      previous.classList.remove('enter');
      previous.classList.add('exit');
      window.setTimeout(() => { app.innerHTML = `<div class="screen enter">${html}</div>`; busy = false; }, 300);
    }

    function start() {
      if (busy) return;
      busy = true;
      scores = { focus:0, action:0, plan:0, people:0 };
      delete document.body.dataset.result; // 재시작하면 기본 파스텔 화면으로 복귀합니다.
      document.querySelector('meta[name="theme-color"]').content = '#f9f4ff';
      index = 0;
      renderQuestion();
    }

    function renderQuestion() {
      const item = questions[index];
      show(`<div class="question-head"><span>나의 일하는 방식</span><span>${index + 1} / ${questions.length}</span></div>
        <div class="progress" role="progressbar" aria-label="진행률" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${index + 1}"><div style="width:${(index + 1) / questions.length * 100}%"></div></div>
        <p class="question-no">QUESTION ${String(index + 1).padStart(2,'0')}</p>
        <h2 id="question-title">${item.q}</h2>
        <div class="choice-list" role="group" aria-labelledby="question-title">
        ${item.a.map((answer, i) => `<button class="choice" type="button" data-option="${i}"><span class="choice-letter">${i === 0 ? 'A' : 'B'}</span><span>${answer[0]}</span></button>`).join('')}
        </div><p class="tiny">답을 누르면 자동으로 다음 질문으로 넘어가요 →</p>`);
    }

    function choose(option) {
      if (busy || index < 0 || index >= questions.length) return;
      busy = true; // 빠르게 두 번 눌러 점수가 중복되는 것을 방지합니다.
      const current = questions[index];
      scores[current.a[option][1]] += 1;
      const clicked = app.querySelector(`[data-option="${option}"]`);
      if (clicked) clicked.classList.add('selected');
      index += 1;
      // 선택 후 잠깐 피드백을 보여주고 화면을 전환합니다.
      window.setTimeout(() => index < questions.length ? renderQuestion() : renderResult(), 140);
    }

    function renderResult() {
      // 동점일 경우 한쪽 유형으로 고정되지 않도록 동점인 유형 중 무작위 선택합니다.
      const highest = Math.max(...Object.values(scores));
      const tied = Object.keys(scores).filter(key => scores[key] === highest);
      const winnerKey = tied[Math.floor(Math.random() * tied.length)];
      const winner = types[winnerKey];
      document.body.dataset.result = winnerKey; // CSS에서 유형별 색상을 적용합니다.
      document.querySelector('meta[name="theme-color"]').content = ({focus:'#f2efff',action:'#fff2ed',plan:'#eaf9f5',people:'#fff9e9'})[winnerKey];
      show(`<div class="result"><span class="tag">✨ 테스트 완료</span>
        <div class="result-icon" aria-hidden="true">${winner.emoji}</div>
        <p class="eyebrow">당신의 일하는 방식은</p><h1>${winner.name}</h1>
        <p class="summary">${winner.description}</p>
        <div class="result-details"><div class="match"><strong>💚 잘 맞는 유형</strong><span>${winner.good}</span></div>
        <div class="match bad"><strong>🌷 다른 리듬의 유형</strong><span>${winner.bad}</span></div></div>
        <p class="note">서로 다르게 일한다고 꼭 안 맞는 건 아니에요.<br>차이를 이해하면 더 멋진 팀이 될 수 있어요!</p>
        <button class="button" type="button" id="restart">↻ 다시 테스트하기</button>
        <p class="tiny">재미로 보는 간단한 성향 테스트예요.</p></div>`);
    }

    // 이벤트 위임으로 새 화면의 버튼도 정상 동작합니다.
    app.addEventListener('click', (event) => {
      const choice = event.target.closest('[data-option]');
      if (choice) { choose(Number(choice.dataset.option)); return; }
      if (event.target.closest('#start') || event.target.closest('#restart')) start();
    });

    // 초기 시작 화면입니다.
    show(`<div class="hero"><span class="tag">🌷 8문항 · 약 1분</span>
      <div class="hero-icon" aria-hidden="true" style="margin-top:36px">🧩</div>
      <h1>나는 어떤 방식으로<br>일하는 사람일까?</h1>
      <p>일을 시작하는 순간부터 팀과 함께하는 방식까지.<br>8개의 선택으로 나만의 업무 스타일을 발견해 보세요.</p>
      <button class="button" id="start" type="button">나의 유형 알아보기 →</button>
      <p class="tiny">4가지 유형 중 나와 가장 가까운 스타일이 나와요</p></div>`);
  </script>
</body>
</html>
